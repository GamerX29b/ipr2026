server:
  port: 8081

spring:
  application:
    name: weather-producer
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/weather_producer
    username: ${DB_USER:weather}
    password: ${DB_PASSWORD:weather}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  kafka:
    topic: weather-updates
